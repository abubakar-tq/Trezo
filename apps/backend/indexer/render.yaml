services:
  - type: web
    name: trezo-indexer
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/backend/indexer
    buildCommand: npm install --no-workspaces && npm run codegen
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL            # Neon pooled/direct, ?sslmode=require
        sync: false
      - key: PONDER_BASE_SEPOLIA_RPC_URL   # Infura: https://base-sepolia.infura.io/v3/<key>
        sync: false
      - key: PONDER_ETH_SEPOLIA_RPC_URL    # Infura: https://sepolia.infura.io/v3/<key>
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Arbitrum Sepolia — leave UNSET until deployed (chain auto-omitted):
      # - key: PONDER_ARB_SEPOLIA_RPC_URL
      # - key: ARB_SEPOLIA_ACCOUNT_FACTORY
      - key: NODE_OPTIONS
        value: "--max-old-space-size=450"
